services:
    freshrss:
        restart: unless-stopped
        logging:
            options:
                max-size: 10m
        expose:
            - "80"
        environment:
            - TZ=Europe/Paris
            - CRON_MIN=1,31
        volumes:
            - ./data/freshrss_data:/var/www/FreshRSS/data
            - ./data/freshrss_extensions:/var/www/FreshRSS/extensions
        container_name: freshrss
        image: freshrss/freshrss
        networks:
        - reverse-proxy
        labels:
        - "traefik.enable=true"
        - "traefik.http.routers.linkwarden.entrypoints=websecure"
        - "traefik.http.routers.linkwarden.middlewares=middleware-authelia@file"
        - "traefik.http.routers.linkwarden.tls=true"
networks:
  reverse-proxy:
    external: true
